name: TezTak Auto Scheduler

on:
  schedule:
    # NEWS - Best times India
    # 7:00 AM IST - Morning commute (1:30 AM UTC)
    - cron: '30 1 * * *'
    # 1:00 PM IST - Lunch break peak (7:30 AM UTC)
    - cron: '30 7 * * *'
    # 4:00 PM IST - After school/work (10:30 AM UTC)
    - cron: '30 10 * * *'

    # SHAYARI - Evening prime time India
    # 7:00 PM IST - Evening start (1:30 PM UTC)
    - cron: '30 13 * * *'
    # 8:00 PM IST - Peak prime time (2:30 PM UTC)
    - cron: '30 14 * * *'
    # 9:00 PM IST - Night scroll (3:30 PM UTC)
    - cron: '30 15 * * *'
  workflow_dispatch:  # Manual trigger bhi kar sako
    inputs:
      mode:
        description: 'news ya shayari'
        required: true
        default: 'shayari'
        type: choice
        options:
          - news
          - shayari

jobs:
  run-teztak:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Setup credentials
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 -d > assets/youtube_token.pkl || true
          echo "${{ secrets.CLIENT_SECRETS }}" | base64 -d > client_secrets.json || true
          mkdir -p assets logs output
        continue-on-error: true

      - name: Detect job type
        id: detect
        run: |
          HOUR=$(TZ='Asia/Kolkata' date +%H)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 19 ]; then
            # 7PM, 8PM, 9PM = Shayari
            echo "mode=shayari" >> $GITHUB_OUTPUT
          else
            # 7AM, 1PM, 4PM = News
            echo "mode=news" >> $GITHUB_OUTPUT
          fi
          echo "IST: $(TZ='Asia/Kolkata' date '+%H:%M'), mode=$(cat $GITHUB_OUTPUT | grep mode | cut -d= -f2)"

      - name: Run Shayari
        if: steps.detect.outputs.mode == 'shayari'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
        run: python github_runner.py shayari 1

      - name: Run News
        if: steps.detect.outputs.mode == 'news'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
        run: python github_runner.py news

      - name: Save YouTube token
        if: always()
        run: |
          if [ -f assets/youtube_token.pkl ]; then
            TOKEN=$(base64 -w 0 assets/youtube_token.pkl)
            echo "New token generated - update secret YOUTUBE_TOKEN with: $TOKEN"
          fi
        continue-on-error: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teztak-output-${{ github.run_number }}
          path: |
            output/
            logs/
          retention-days: 3

  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Keep repo active
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          echo "Last run: $(date)" >> .github/last_run.txt
          git add .github/last_run.txt
          git diff --staged --quiet || git commit -m "Auto: keep alive $(date '+%Y-%m-%d')"
          git push || true