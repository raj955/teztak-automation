name: TezTak Auto Scheduler

on:
  schedule:
    # IST times (UTC = IST - 5:30)
    - cron: '30 1 * * *'   # 7:00 AM IST - News (morning commute)
    - cron: '30 7 * * *'   # 1:00 PM IST - News (lunch break)
    - cron: '0 11 * * *'   # 4:30 PM IST - Viral (after school/work)
    - cron: '30 13 * * *'  # 7:00 PM IST - News (prime time)
    - cron: '0 14 * * *'   # 7:30 PM IST - Wisdom/Osho
    - cron: '0 15 * * *'   # 8:30 PM IST - Shayari
    - cron: '30 15 * * *'  # 9:00 PM IST - Viral

  workflow_dispatch:
    inputs:
      mode:
        description: 'news / shayari / viral / wisdom'
        required: true
        default: 'news'
        type: choice
        options:
          - news
          - shayari
          - viral
          - wisdom

jobs:
  run-teztak:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Setup credentials
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 -d > assets/youtube_token.pkl || true
          echo "${{ secrets.CLIENT_SECRETS }}" | base64 -d > client_secrets.json || true
          mkdir -p assets logs output
        continue-on-error: true

      - name: Detect job type
        id: detect
        run: |
          HOUR=$(TZ='Asia/Kolkata' date +%H)
          MIN=$(TZ='Asia/Kolkata' date +%M)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -eq 19 ] && [ "$MIN" -ge 25 ]; then
            echo "mode=wisdom" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -eq 20 ] && [ "$MIN" -lt 30 ]; then
            echo "mode=wisdom" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -ge 20 ] && [ "$MIN" -ge 30 ]; then
            echo "mode=shayari" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -eq 21 ]; then
            echo "mode=viral" >> $GITHUB_OUTPUT
          elif [ "$HOUR" -eq 16 ]; then
            echo "mode=viral" >> $GITHUB_OUTPUT
          else
            echo "mode=news" >> $GITHUB_OUTPUT
          fi
          IST_TIME=$(TZ='Asia/Kolkata' date '+%H:%M')
          echo "IST time: $IST_TIME"

      - name: Run News (with retry)
        if: steps.detect.outputs.mode == 'news'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
        run: |
          for i in 1 2 3; do
            python github_runner.py news && break
            echo "Retry $i... waiting 30s"
            sleep 30
          done

      - name: Run Wisdom (with retry)
        if: steps.detect.outputs.mode == 'wisdom'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
        run: |
          for i in 1 2 3; do
            python github_runner.py wisdom && break
            echo "Retry $i... waiting 30s"
            sleep 30
          done

      - name: Run Shayari (with retry)
        if: steps.detect.outputs.mode == 'shayari'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
        run: |
          for i in 1 2 3; do
            python github_runner.py shayari 1 && break
            echo "Retry $i... waiting 30s"
            sleep 30
          done

      - name: Run Viral (with retry)
        if: steps.detect.outputs.mode == 'viral'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          YOUTUBE_CLIENT_SECRETS: client_secrets.json
        run: |
          for i in 1 2 3; do
            python github_runner.py viral && break
            echo "Retry $i... waiting 30s"
            sleep 30
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teztak-output-${{ github.run_number }}
          path: output/
          retention-days: 3

  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Keep repo active
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          echo "Last run: $(date)" >> .github/last_run.txt
          git add .github/last_run.txt
          git diff --staged --quiet || git commit -m "Auto: keep alive $(date '+%Y-%m-%d')"
          git push || true